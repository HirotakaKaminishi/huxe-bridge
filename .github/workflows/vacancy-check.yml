name: vacancy-check

# 楽天トラベル空室検索APIを叩いて、結果を実行サマリに出す。
# 宿泊在庫は都度確認するものなので定期実行はしない。
#
# 起動方法は2通り:
#   1. tools/vacancy_query.json を書き換えて push する (ブランチ問わず動く)
#   2. Actions タブから手動実行する (workflow_dispatch はワークフローが
#      デフォルトブランチに存在して初めて選べるようになる)
on:
  push:
    paths:
      - 'tools/vacancy_query.json'
      - 'tools/vacancy_search.py'
      - '.github/workflows/vacancy-check.yml'
  workflow_dispatch:
    inputs:
      checkin:
        description: 'チェックイン日 YYYY-MM-DD (空なら vacancy_query.json の値)'
        required: false
        default: ''
      checkout:
        description: 'チェックアウト日 YYYY-MM-DD (空なら vacancy_query.json の値)'
        required: false
        default: ''
      adults:
        description: '大人の人数 (空なら vacancy_query.json の値)'
        required: false
        default: ''
      rooms:
        description: '部屋数 (空なら vacancy_query.json の値)'
        required: false
        default: ''
      areas:
        description: 'カンマ区切りのエリア名 (空なら vacancy_query.json の値)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: vacancy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Search vacancies
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          CHECKIN: ${{ inputs.checkin }}
          CHECKOUT: ${{ inputs.checkout }}
          ADULTS: ${{ inputs.adults }}
          ROOMS: ${{ inputs.rooms }}
          AREAS: ${{ inputs.areas }}
        run: |
          if [ -z "$RAKUTEN_APP_ID" ] || [ -z "$RAKUTEN_ACCESS_KEY" ]; then
            msg='Secrets に RAKUTEN_APP_ID と RAKUTEN_ACCESS_KEY を登録してください'
            # 手動起動は「実行するつもり」なので失敗させる。
            # push 起因は設定前でも赤くしたくないのでスキップ扱いにする。
            if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
              echo "::error::$msg"
              exit 1
            fi
            echo "::notice::$msg (未設定のためスキップしました)"
            echo "> [!NOTE]" >> "$GITHUB_STEP_SUMMARY"
            echo "> $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '```'
            python tools/vacancy_search.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
